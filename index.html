<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>@kullanıcıadın</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --btn: rgba(255, 255, 255, 0.25);
      --btn-hover: rgba(255, 255, 255, 0.4);
    }
    .dark { /* Karanlık mod isteğe bağlı */
      --bg: linear-gradient(135deg, #0f0f0f 0%, #1f1f1f 100%);
      --card: rgba(0, 0, 0, 0.5);
      --btn: rgba(255, 255, 255, 0.15);
      --btn-hover: rgba(255, 255, 255, 0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .container {
      background: var(--card);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      opacity: 0.9;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .links a {
      display: block;
      background: var(--btn);
      color: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      font-size: 17px;
    }
    .links a:hover {
      transform: translateY(-4px) scale(1.02);
      background: var(--btn-hover);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .links i { margin-right: 12px; font-size: 20px; }
    .theme-toggle {
      margin-top: 30px;
      padding: 10px;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="https://i.imgur.com/örnekfotograf.jpg" alt="Profil" class="avatar">
  <h1>@kullanıcıadın</h1>
  <p>Dijital içerik üreticisi • Fotoğrafçı • İstanbul</p>

  <div class="links">
    <a href="https://instagram.com/..." target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a href="https://youtube.com/..." target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
    <a href="https://tiktok.com/..." target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    <a href="https://twitch.tv/..." target="_blank"><i class="fab fa-twitch"></i> Twitch</a>
    <a href="https://twitter.com/..." target="_blank"><i class="fab fa-twitter"></i> Twitter / X</a>
    <a href="https://discord.gg/..." target="_blank"><i class="fab fa-discord"></i> Discord</a>
    <a href="mailto:info@ornek.com"><i class="fas fa-envelope"></i> İş Birliği & İletişim</a>
  </div>

  <div class="theme-toggle" onclick="document.body.classList.toggle('dark')">
    <i class="fas fa-moon"></i> / <i class="fas fa-sun"></i>
  </div>
</div>

</body>
</html>
